; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ntp_clock

boards_dir = ./board
src_dir = examples/${platformio.default_envs}
test_dir = examples/ntp_clock/test

[esp32_base]
platform = espressif32 @6.5.0
board = T-Display-Long
framework = arduino
extra_scripts = post:extra_script.py 

build_flags = 
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -UARDUINO_USB_CDC_ON_BOOT

board_build.partitions = huge_app.csv

[env:ntp_clock]
extends = esp32_base
; 6.13.0 ships Arduino-ESP32 2.0.17, the last 2.x core
platform = espressif32 @6.13.0
; EEZ's ui.c installs a light theme; its fonts lack Thai tone stacking.
build_src_filter = +<*> -<eez/gen/ui.c> -<eez/gen/ui_font_*.c> -<test/>
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    links2004/WebSockets@2.6.1
build_flags = ${esp32_base.build_flags} -DWEBSOCKETS_SERVER_CLIENT_MAX=2
board_build.partitions = examples/ntp_clock/partitions_longdeck.csv
[env:native_deck]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=gnu++17
lib_deps = bblanchon/ArduinoJson@7.2.1
build_src_filter = -<*> +<deck_crypto.cpp> +<deck_proto.cpp> +<deck_layout.cpp> +<deck_live.cpp> +<deck_claude.cpp> +<vendor/>
